{% extends 'base.html' %}
{% block content %}
<h3>Пользователи</h3>
<table class="table table-sm">
<thead><tr><th>ID</th><th>Telegram ID</th><th>Имя</th><th>Телефон</th><th>Действия</th></tr></thead>
<tbody>
{% for u in users %}
<tr>
  <td>{{ u.id }}</td>
  <td>{{ u.telegram_id }}</td>
  <td>{{ u.first_name }} {{ u.last_name }} (@{{ u.telegram_username }})</td>
  <td>{{ u.phone or '' }}</td>
  <td>
    <a href="/admin/users/{{ u.id }}/edit" class="btn btn-sm btn-outline-secondary">Edit</a>
    <form method="post" action="/admin/users/{{ u.id }}/delete" style="display:inline; margin-left:6px;">
      <button class="btn btn-sm btn-danger" type="submit" onclick="return confirm('Удалить пользователя? Это действие необратимо.')">Delete</button>
    </form>
  </td>
</tr>
{% endfor %}
</tbody>
</table>
{% endblock %}
