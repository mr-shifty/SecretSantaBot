{% extends 'base.html' %}
{% block content %}
<h3>Редактировать запись 'Диджитал Санта (с поздравлениями)' #{{ entry.id }}</h3>

<form method="post" action="/admin/route2/{{ entry.id }}/edit">
  <div class="mb-3">
    <label class="form-label">Email</label>
    <input class="form-control" name="email" value="{{ entry.email }}" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Телефон пользователя (опционально)</label>
    <input class="form-control" name="phone" value="{{ user.phone or '' }}">
  </div>

  <button class="btn btn-primary" type="submit">Сохранить</button>
  <a href="/admin/route2" class="btn btn-secondary">Отмена</a>
</form>

<hr>

<h4>📸 Загруженная открытка</h4>
{% if entry.image_path %}
  <div class="mb-3">
    <img src="/media/{{ entry.image_path }}" style="max-width: 300px;" alt="Открытка">
    <br>
    <a href="/media/{{ entry.image_path }}" class="btn btn-sm btn-info mt-2" download>Скачать</a>
  </div>
{% else %}
  <p>❌ Открытка не загружена</p>
{% endif %}

<hr>

<form method="post" action="/admin/route2/{{ entry.id }}/delete">
  <button class="btn btn-danger" type="submit" onclick="return confirm('Удалить запись маршрута &quot;С поздравлениями&quot;? Это действие необратимо.')">Удалить запись</button>
</form>
{% endblock %}
