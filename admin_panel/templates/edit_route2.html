{% extends 'base.html' %}
{% block content %}
<h3>Редактировать запись Маршрут 2 #{{ entry.id }}</h3>
<form method="post" action="/admin/route2/{{ entry.id }}/edit">
  <div class="mb-3">
    <label class="form-label">Email</label>
    <input class="form-control" name="email" value="{{ entry.email }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Телефон пользователя (опционально)</label>
    <input class="form-control" name="phone" value="{{ user.phone or '' }}">
  </div>
  <button class="btn btn-primary" type="submit">Сохранить</button>
  <a href="/admin/route2" class="btn btn-secondary">Отмена</a>
</form>
<hr>
<form method="post" action="/admin/route2/{{ entry.id }}/delete">
  <button class="btn btn-danger" type="submit" onclick="return confirm('Удалить запись маршрута 2? Это действие необратимо.')">Удалить запись</button>
</form>
{% endblock %}
