{% extends 'base.html' %}
{% block content %}
<h3>Маршрут 1 — записи</h3>
<table class="table table-sm">
<thead><tr><th>ID</th><th>User</th><th>Email</th><th>Адрес</th><th>Пожелания</th><th>Статус</th><th>Действия</th></tr></thead>
<tbody>
{% for e in entries %}
<tr>
  <td>{{ e.id }}</td>
  <td>{{ e.user_id }}</td>
  <td>{{ e.email }}</td>
  <td>{{ e.full_address }}</td>
  <td>{{ e.wishlist or '-' }}</td>
  <td>{{ e.status }}</td>
  <td>
    <a href="/admin/route1/{{ e.id }}/edit" class="btn btn-sm btn-outline-secondary">Edit</a>
    <form method="post" action="/admin/route1/{{ e.id }}/delete" style="display:inline; margin-left:6px;">
      <button class="btn btn-sm btn-danger" type="submit" onclick="return confirm('Удалить запись маршрута 1? Это действие необратимо.')">Delete</button>
    </form>
  </td>
</tr>
{% endfor %}
</tbody>
</table>
{% endblock %}
