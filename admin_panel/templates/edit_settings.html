{% extends 'base.html' %}
{% block content %}
<h3>Настройки напоминаний</h3>
<form method="post" action="/admin/settings">
  <div class="mb-3">
    <label class="form-label">Интервал напоминаний о отправке (в часах)</label>
    <input class="form-control" name="assignment_reminder_hours" value="{{ settings.assignment_reminder_hours }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Интервал напоминаний о регистрации (в часах)</label>
    <input class="form-control" name="registration_reminder_hours" value="{{ settings.registration_reminder_hours }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Максимум напоминаний по назначению (шт)</label>
    <input class="form-control" name="assignment_reminder_max" value="{{ settings.assignment_reminder_max }}">
  </div>
  <div class="form-check mb-3">
    <input class="form-check-input" type="checkbox" id="reminder_enabled" name="reminder_enabled" {% if settings.reminder_enabled %}checked{% endif %}>
    <label class="form-check-label" for="reminder_enabled">Включить напоминания</label>
  </div>
  <button class="btn btn-primary" type="submit">Сохранить</button>
</form>
{% endblock %}
